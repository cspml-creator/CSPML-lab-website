backend:
  name: git-gateway
  branch: v3

publish_mode: editorial_workflow

media_folder: images/uploads
public_folder: /images/uploads

collections:

  - name: publications
    label: Publications
    files:
      - name: publications
        label: Publications List
        file: data/publications.json
        fields:
          - name: publications
            label: Publications
            widget: list
            fields:
              - { name: title,   label: Title,   widget: string }
              - { name: authors, label: Authors, widget: string }
              - { name: year,    label: Year,    widget: number }
              - { name: venue,   label: Venue,   widget: string }
              - name: type
                label: Type
                widget: select
                options: [journal, conference]
              - { name: recent, label: Recent, widget: boolean, default: false }

  - name: faculty
    label: Faculty
    files:
      - name: faculty
        label: Faculty List
        file: data/faculty.json
        fields:
          - name: faculty
            label: Faculty
            widget: list
            fields:
              - { name: name,           label: Name }
              - { name: role,           label: Role }
              - { name: initials,       label: Initials }
              - { name: photo,          label: Photo URL }
              - { name: profile_url,    label: Profile URL }
              - { name: research_areas, label: Research Areas }

  - name: students
    label: Students
    files:
      - name: students
        label: Students List
        file: data/students.json
        fields:
          - name: phd
            label: PhD Students
            widget: list
            fields:
              - { name: name,       label: Name }
              - { name: initials,   label: Initials }
              - { name: photo,      label: Photo URL }
              - { name: status,     label: Status, widget: select, options: [pursuing, graduated] }
              - { name: supervisor, label: Supervisor }
              - { name: bio,        label: Bio }
          - name: ms
            label: MS Students
            widget: list
            fields:
              - { name: name,       label: Name }
              - { name: initials,   label: Initials }
              - { name: photo,      label: Photo URL }
              - { name: status,     label: Status, widget: select, options: [pursuing, graduated] }
              - { name: supervisor, label: Supervisor }
              - { name: bio,        label: Bio }
          - name: mtech
            label: MTech Students
            widget: list
            fields:
              - { name: name,       label: Name }
              - { name: initials,   label: Initials }
              - { name: photo,      label: Photo URL }
              - { name: status,     label: Status, widget: select, options: [pursuing, graduated] }
              - { name: supervisor, label: Supervisor }
              - { name: bio,        label: Bio }
          - name: project
            label: Project Students
            widget: list
            fields:
              - { name: name,       label: Name }
              - { name: initials,   label: Initials }
              - { name: photo,      label: Photo URL }
              - { name: status,     label: Status, widget: select, options: [pursuing, graduated] }
              - { name: supervisor, label: Supervisor }
              - { name: bio,        label: Bio }
