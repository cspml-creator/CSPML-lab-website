backend:
  name: github
  repo: cspml-creator/CSPML-lab-website
  branch: main

publish_mode: editorial_workflow

media_folder: images/uploads
public_folder: /images/uploads

collections:

  - name: publications
    label: Publications
    file: data/publications.json
    format: json
    fields:
      - name: publications
        label: Publications
        widget: list
        fields:
          - { name: title,   label: Title }
          - { name: authors, label: Authors }
          - { name: year,    label: Year,   widget: number }
          - { name: venue,   label: Venue }
          - name: type
            label: Type
            widget: select
            options: [journal, conference]
          - { name: recent, label: Recent, widget: boolean, default: false }

  - name: faculty
    label: Faculty
    file: data/faculty.json
    format: json
    fields:
      - name: faculty
        label: Faculty
        widget: list
        fields:
          - { name: name,             label: Name }
          - { name: role,             label: Role }
          - { name: initials,         label: Initials }
          - { name: photo,            label: Photo URL }
          - { name: profile_url,      label: Profile URL }
          - { name: research_areas,   label: Research Areas }

  - name: students
    label: Students
    file: data/students.json
    format: json
    fields:
      - name: phd
        label: PhD Students
        widget: list
        fields:
          - { name: name,       label: Name }
          - { name: initials,   label: Initials }
          - { name: photo,      label: Photo URL }
          - { name: status,     label: Status, widget: select, options: [pursuing, graduated] }
          - { name: supervisor, label: Supervisor }
          - { name: bio,        label: Bio }
      - name: ms
        label: MS Students
        widget: list
        fields:
          - { name: name,       label: Name }
          - { name: initials,   label: Initials }
          - { name: photo,      label: Photo URL }
          - { name: status,     label: Status, widget: select, options: [pursuing, graduated] }
          - { name: supervisor, label: Supervisor }
          - { name: bio,        label: Bio }
      - name: mtech
        label: MTech Students
        widget: list
        fields:
          - { name: name,       label: Name }
          - { name: initials,   label: Initials }
          - { name: photo,      label: Photo URL }
          - { name: status,     label: Status, widget: select, options: [pursuing, graduated] }
          - { name: supervisor, label: Supervisor }
          - { name: bio,        label: Bio }
      - name: project
        label: Project Students
        widget: list
        fields:
          - { name: name,       label: Name }
          - { name: initials,   label: Initials }
          - { name: photo,      label: Photo URL }
          - { name: status,     label: Status, widget: select, options: [pursuing, graduated] }
          - { name: supervisor, label: Supervisor }
          - { name: bio,        label: Bio }
